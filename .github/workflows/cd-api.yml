# CD API：ghcr 拉取 → 推送阿里云 ACR（不可变 tag） → Helm 发布到 k3s
# 全面 helm 部署，不使用 SSH/compose。
# 由 cd-deploy.yml 编排器调用（workflow_call），也可单独 workflow_dispatch 手动部署。
#
# 部署动作在 deploy job 中通过可复用工作流 cd-helm-deploy.yml 完成，
# 该 job 持有集群凭据（secrets.KUBECONFIG），push-image job 不接触集群。

name: CD API

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prod, dev]
        default: dev
      image_tag:
        type: string
        description: '镜像 tag（留空 = latest(prod) / develop(dev)）'
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    name: Push api-service image to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Resolve image tag
      id: vars
      run: |
        ENV="${{ inputs.environment }}"
        TAG="${{ inputs.image_tag }}"
        if [ "$ENV" = "prod" ]; then
          [ -z "$TAG" ] && TAG=latest
        else
          [ -z "$TAG" ] && TAG=develop
        fi
        echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "env_name=$ENV" >> "$GITHUB_OUTPUT"

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull api-service image from ghcr
      run: |
        IMAGE="ghcr.io/${{ steps.image.outputs.name }}/bluenet-api-service:${{ steps.vars.outputs.image_tag }}"
        echo "Pulling $IMAGE"
        docker pull "$IMAGE"

    - name: Login to Aliyun ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_REPO }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PWD }}

    - name: Tag and push image to Aliyun ACR
      env:
        GHCR_IMAGE: ghcr.io/${{ steps.image.outputs.name }}/bluenet-api-service:${{ steps.vars.outputs.image_tag }}
        # 不可变 tag：Helm 部署与回滚使用（旧 tag 永存，回滚才有意义）
        ACR_IMAGE: ${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:api-${{ steps.vars.outputs.image_tag }}
        # 浮动别名：仅供本地调试，不用于部署
        ACR_ALIAS: ${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:api
      run: |
        set -e
        echo "Pushing $ACR_IMAGE"
        docker tag "$GHCR_IMAGE" "$ACR_IMAGE"
        docker push "$ACR_IMAGE"
        echo "Pushing $ACR_ALIAS"
        docker tag "$GHCR_IMAGE" "$ACR_ALIAS"
        docker push "$ACR_ALIAS"

  deploy:
    name: Deploy api-service to k3s (Helm)
    needs: push-image
    uses: ./.github/workflows/cd-helm-deploy.yml
    secrets: inherit
    with:
      service: api
      image_tag: api-${{ needs.push-image.outputs.image_tag }}
      environment: ${{ inputs.environment }}
