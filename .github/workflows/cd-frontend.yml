# CD Frontend：构建（含 NEXT_PUBLIC_* 构建期注入） → ghcr → 阿里云 ACR（不可变 tag） → Helm 发布到 k3s
# 全面 helm 部署，不使用 SSH/compose。
#
# 注意：NEXT_PUBLIC_* 是构建期注入，改变目标地址必须重新构建镜像。
#   - SSR（服务端）目标：vars.K8S_BACKEND_*（集群内 Service DNS，如 bluenet-api:8080）
#   - 浏览器侧目标：vars.PUBLIC_*（生产域名，经 nginx）
#   未设置上述变量时回退旧 vars（BACKEND_HOST 等），行为与迁移前一致。

name: CD Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prod, dev]
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push frontend image to ACR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Resolve environment
      id: vars
      run: |
        ENV="${{ inputs.environment }}"
        if [ "$ENV" = "prod" ]; then
          echo "float_tag=latest" >> "$GITHUB_OUTPUT"
        else
          echo "float_tag=develop" >> "$GITHUB_OUTPUT"
        fi
        echo "env_name=$ENV" >> "$GITHUB_OUTPUT"

    - name: Wait for backend health before building frontend
      run: |
        PROTOCOL="${{ (vars.PUBLIC_SSL_ENABLED || vars.SSL_ENABLED) == 'true' && 'https' || 'http' }}"
        URL="${PROTOCOL}://${{ vars.PUBLIC_HOST || vars.BACKEND_HOST }}:${{ vars.PUBLIC_PORT || vars.BACKEND_PORT }}/api/v1/health"
        echo "Waiting for backend at $URL to be healthy..."
        for i in {1..30}; do
          RESPONSE=$(curl -sfL "$URL" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✅ Backend is healthy!"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 10
        done
        echo "❌ Backend health check failed after 5 minutes"
        exit 1

    - name: Read frontend version from trigger/frontend
      id: version
      run: |
        if [ ! -f trigger/frontend ]; then
          echo "::warning::trigger/frontend 不存在，跳过前端构建部署（自动 CD 已关闭）"
          echo "skip_build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        VERSION=$(tr -d '[:space:]' < trigger/frontend)
        if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ trigger/frontend 版本号格式非法: '$VERSION'（应为 x.y.z）"
          exit 1
        fi
        echo "skip_build=false" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set image name
      id: image
      run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      if: steps.version.outputs.skip_build != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: steps.version.outputs.skip_build != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      if: steps.version.outputs.skip_build != 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.image.outputs.owner }}/bluenet-frontend
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=sha,prefix=sha-
          type=raw,value=${{ steps.vars.outputs.float_tag }}

    - name: Build frontend image
      if: steps.version.outputs.skip_build != 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/frontend.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          CACHE_BUST=${{ github.sha }}_${{ github.run_id }}
          # SSR 目标：集群内 Service DNS
          BUILD_BACKEND_HOST=${{ vars.K8S_BACKEND_HOST || vars.BACKEND_HOST }}
          BUILD_BACKEND_PORT=${{ vars.K8S_BACKEND_PORT || vars.BACKEND_PORT }}
          BUILD_SSL_ENABLED=${{ vars.K8S_SSL_ENABLED || 'false' }}
          # 浏览器侧目标：生产域名（经 nginx）
          NEXT_PUBLIC_BACKEND_HOST=${{ vars.PUBLIC_HOST || vars.BACKEND_HOST }}
          NEXT_PUBLIC_BACKEND_PORT=${{ vars.PUBLIC_PORT || vars.BACKEND_PORT }}
          NEXT_PUBLIC_SSL_ENABLED=${{ vars.PUBLIC_SSL_ENABLED || vars.SSL_ENABLED }}
          NEXT_PUBLIC_AI_SERVICE_HOST=${{ vars.PUBLIC_AI_HOST || vars.AI_SERVICE_HOST }}
          NEXT_PUBLIC_AI_SERVICE_PORT=${{ vars.PUBLIC_AI_PORT || vars.AI_SERVICE_PORT || '8000' }}
          NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED=${{ vars.PUBLIC_AI_SSL_ENABLED || vars.AI_SERVICE_SSL_ENABLED || vars.SSL_ENABLED }}
          NEXT_PUBLIC_AI_SERVICE_PREFIX=${{ vars.AI_SERVICE_PREFIX || '/ai/v1' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push frontend image to ghcr.io
      if: steps.version.outputs.skip_build != 'true'
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Login to Aliyun ACR
      if: steps.version.outputs.skip_build != 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_REPO }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PWD }}

    - name: Tag and push image to Aliyun ACR
      if: steps.version.outputs.skip_build != 'true'
      env:
        GHCR_IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/bluenet-frontend:${{ steps.version.outputs.version }}
        ACR_IMAGE: ${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:frontend-${{ steps.version.outputs.version }}
        ACR_ALIAS: ${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}:frontend
      run: |
        set -e
        echo "Pushing $ACR_IMAGE"
        docker tag "$GHCR_IMAGE" "$ACR_IMAGE"
        docker push "$ACR_IMAGE"
        echo "Pushing $ACR_ALIAS"
        docker tag "$GHCR_IMAGE" "$ACR_ALIAS"
        docker push "$ACR_ALIAS"

  deploy:
    name: Deploy frontend to k3s (Helm)
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.image_tag != '' }}
    uses: ./.github/workflows/cd-helm-deploy.yml
    secrets: inherit
    with:
      service: frontend
      image_tag: frontend-${{ needs.build-and-push.outputs.image_tag }}
      environment: ${{ inputs.environment }}
