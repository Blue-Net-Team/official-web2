# 临时诊断工作流：复制 cd-deploy 的剩余关键结构定位 startup_failure 根因
name: Test Caller

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      target_service:
        type: choice
        options: [all, api, frontend, judge, ai, infra]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      api_enabled: ${{ steps.resolve.outputs.api_enabled }}
    steps:
    - id: resolve
      run: echo "api_enabled=true" >> "$GITHUB_OUTPUT"

  test-api:
    needs: [resolve-context]
    if: needs.resolve-context.outputs.api_enabled == 'true'
    uses: ./.github/workflows/cd-api.yml
    with:
      environment: dev
      image_tag: develop
