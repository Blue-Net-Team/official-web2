# 临时诊断工作流：验证 workflow_run + workflow_dispatch 事件组合是否可调用可复用工作流
name: Test Caller

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-api:
    uses: ./.github/workflows/cd-api.yml
    with:
      environment: dev
      image_tag: develop
