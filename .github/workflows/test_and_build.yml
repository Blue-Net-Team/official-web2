# CI/CD Pipeline 工作流
# 支持多分支部署：master -> 生产环境，develop -> 开发环境
# 分阶段部署：后端 -> 健康检查 -> 前端

name: CI/CD Pipeline

# 触发条件配置
on:
  # 推送到 master 或 develop 分支时触发
  push:
    branches: [ master, develop ]
  # PR 到 master 或 develop 分支时触发（仅运行测试）
  pull_request:
    branches: [ master, develop ]
  # 支持手动触发
  workflow_dispatch:

# 全局环境变量
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/bluenet-backend
  FRONTEND_IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/bluenet-frontend

jobs:
  # ==================== 测试阶段 ====================

  # 后端测试 Job
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
    - uses: actions/checkout@v4

    # 配置 JDK 21 环境
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 缓存 Maven 依赖，加速后续构建
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # 赋予 Maven Wrapper 执行权限
    - name: Make mvnw executable
      run: chmod +x ./mvnw

    # 编译后端代码
    - name: Compile backend
      run: ./mvnw -B clean compile

    # 运行后端测试（包含 Testcontainers 集成测试）
    - name: Run backend tests
      run: ./mvnw -B test

  # 前端测试 Job
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
    - uses: actions/checkout@v4

    # 安装 pnpm 包管理器
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    # 配置 Node.js 20 环境
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: src/frontend/pnpm-lock.yaml

    # 安装前端依赖
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # TypeScript 类型检查
    - name: TypeScript check
      run: npx tsc --noEmit

    # ESLint 代码检查
    - name: Lint check
      run: pnpm lint

  # ==================== 构建阶段 ====================

  # 构建并推送后端 Docker 镜像
  build-backend:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build backend JAR
      working-directory: src/backend
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests -B

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== 部署后端阶段 ====================

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.event_name == 'push'
    outputs:
      deploy_host: ${{ steps.vars.outputs.deploy_host }}

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Deploy backend via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: GITHUB_ACTOR, BACKEND_IMAGE, DEPLOY_PATH, GITHUB_TOKEN
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying backend to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Logging in to GitHub Container Registry..."
          echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

          echo "Pulling backend image..."
          docker compose pull backend

          echo "Starting backend service..."
          docker compose up -d backend --remove-orphans

          echo "Backend deployment completed!"
      env:
        BACKEND_IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/bluenet-backend:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 健康检查阶段 ====================

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event_name == 'push'
    timeout-minutes: 5

    steps:
    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
        else
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
        fi

    - name: Wait for backend health check
      run: |
        HOST="${{ steps.vars.outputs.deploy_host }}"
        echo "Waiting for backend at $HOST:8080 to be healthy..."

        for i in {1..30}; do
          RESPONSE=$(curl -sf http://$HOST:8080/api/v1/health 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✅ Backend is healthy!"
            echo "Response: $RESPONSE"
            exit 0
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 10
        done

        echo "❌ Backend health check failed after 5 minutes"
        exit 1

  # ==================== 构建前端阶段 ====================

  build-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test, health-check]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # 构建时使用公网地址访问后端 API（用于 Next.js 预渲染）
        build-args: |
          BUILD_BACKEND_HOST=${{ steps.vars.outputs.deploy_host }}
          BUILD_BACKEND_PORT=8080
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== 部署前端阶段 ====================

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Deploy frontend via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: GITHUB_ACTOR, FRONTEND_IMAGE, DEPLOY_PATH, GITHUB_TOKEN
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying frontend to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Logging in to GitHub Container Registry..."
          echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

          echo "Pulling frontend image..."
          docker compose pull frontend

          echo "Starting frontend service..."
          docker compose up -d frontend --remove-orphans

          echo "Cleaning up old images..."
          docker image prune -f

          echo "✅ Deployment to ${{ steps.vars.outputs.env_name }} completed successfully!"
      env:
        FRONTEND_IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/bluenet-frontend:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
