# CI/CD Pipeline 工作流
# 支持多分支部署：master -> 生产环境，develop -> 开发环境
# 分阶段部署：基础设施 -> API/判题服务 -> 健康检查 -> 前端
# 部署方式：构建镜像后 docker save -> SCP 传输到服务器 -> docker load 导入（避免国内服务器 pull ghcr.io 超时）

name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== API 服务测试阶段 ====================

  api-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Compile api-service
      run: ./mvnw -B clean compile

    - name: Run api-service tests
      run: ./mvnw -B test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: src/frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: TypeScript check
      run: npx tsc --noEmit

    - name: Lint check
      run: pnpm lint

  # ==================== 判题服务测试阶段 ====================

  judge-service-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Make mvnw executable
      run: chmod +x src/backend/mvnw

    - name: Compile judge-service
      run: src/backend/mvnw -B clean compile -f src/judge-service/pom.xml

    - name: Run judge-service tests
      run: src/backend/mvnw -B test -f src/judge-service/pom.xml

  # ==================== AI 服务测试阶段 ====================

  ai-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai-service

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.x"

    - name: Sync dependencies
      run: uv sync --frozen --no-dev

    - name: Ruff check
      run: uv run ruff check .

  # ==================== 构建 API 服务阶段 ====================

  build-api-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [api-service-test]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build api-service JAR
      working-directory: src/backend
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests -B

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-api-service
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build api-service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/api-service.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push api-service image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save api-service image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-api-service:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-api-service:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > api-service-image.tar.gz

    - name: Upload api-service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-service-image
        path: api-service-image.tar.gz
        retention-days: 1

  # ==================== 构建判题服务阶段 ====================

  build-judge-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [judge-service-test]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build judge-service JAR
      run: |
        chmod +x src/backend/mvnw
        src/backend/mvnw clean package -DskipTests -B -f src/judge-service/pom.xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-judge-service
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build judge-service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/judge-service.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push judge-service image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save judge-service image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-judge-service:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-judge-service:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > judge-service-image.tar.gz

    - name: Upload judge-service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: judge-service-image
        path: judge-service-image.tar.gz
        retention-days: 1

  # ==================== 构建 AI 服务阶段 ====================

  build-ai-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [ai-service-test]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-ai-service
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build ai-service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/ai-service.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push ai-service image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save ai-service image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-ai-service:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-ai-service:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > ai-service-image.tar.gz

    - name: Upload ai-service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai-service-image
        path: ai-service-image.tar.gz
        retention-days: 1

  # ==================== 部署数据库基础设施阶段（PostgreSQL + Redis）====================

  deploy-database-infra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [api-service-test, frontend-test, judge-service-test, ai-service-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DATABASE_DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DATABASE_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DATABASE_DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DATABASE_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DATABASE_DEPLOY_USER }}
        key: ${{ secrets.DATABASE_DEPLOY_KEY }}
        port: ${{ secrets.DATABASE_DEPLOY_PORT }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Deploy database and redis via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DATABASE_DEPLOY_USER }}
        key: ${{ secrets.DATABASE_DEPLOY_KEY }}
        port: ${{ secrets.DATABASE_DEPLOY_PORT }}
        envs: DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH
          echo "=== Deploying database and redis to ${{ steps.vars.outputs.env_name }} environment ==="
          docker compose up -d database redis --remove-orphans
          echo "Database and redis deployment completed!"
      env:
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署 RabbitMQ 阶段 ====================

  deploy-rabbitmq:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [api-service-test, frontend-test, judge-service-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.RABBITMQ_DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.RABBITMQ_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.RABBITMQ_DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.RABBITMQ_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.RABBITMQ_DEPLOY_USER }}
        key: ${{ secrets.RABBITMQ_DEPLOY_KEY }}
        port: ${{ secrets.RABBITMQ_DEPLOY_PORT }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Deploy rabbitmq via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.RABBITMQ_DEPLOY_USER }}
        key: ${{ secrets.RABBITMQ_DEPLOY_KEY }}
        port: ${{ secrets.RABBITMQ_DEPLOY_PORT }}
        envs: DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH
          echo "=== Deploying rabbitmq to ${{ steps.vars.outputs.env_name }} environment ==="
          docker compose up -d rabbitmq --remove-orphans
          echo "RabbitMQ deployment completed!"
      env:
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署 API 服务阶段 ====================

  deploy-api-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-api-service, deploy-database-infra, deploy-rabbitmq]
    outputs:
      deploy_host: ${{ steps.vars.outputs.deploy_host }}

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download api-service image artifact
      uses: actions/download-artifact@v4
      with:
        name: api-service-image
        path: ./images

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: "images/api-service-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy api-service via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        envs: API_SERVICE_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying api-service to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading api-service image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/api-service-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/api-service-image.tar.gz

          echo "Starting api-service..."
          export API_SERVICE_IMAGE="${API_SERVICE_IMAGE}"
          docker compose --profile app up -d api-service --remove-orphans

          echo "Api-service deployment completed!"
      env:
        API_SERVICE_IMAGE: bluenet-api-service:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署判题服务阶段 ====================

  deploy-judge-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-judge-service, deploy-database-infra, deploy-rabbitmq]

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.JUDGE_DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.JUDGE_DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.JUDGE_DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.JUDGE_DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download judge-service image artifact
      uses: actions/download-artifact@v4
      with:
        name: judge-service-image
        path: ./images

    - name: Sync compose file to judge server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.JUDGE_DEPLOY_USER }}
        key: ${{ secrets.JUDGE_DEPLOY_KEY }}
        port: ${{ secrets.JUDGE_DEPLOY_PORT || 22 }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.JUDGE_DEPLOY_USER }}
        key: ${{ secrets.JUDGE_DEPLOY_KEY }}
        port: ${{ secrets.JUDGE_DEPLOY_PORT || 22 }}
        source: "images/judge-service-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy judge-service via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.JUDGE_DEPLOY_USER }}
        key: ${{ secrets.JUDGE_DEPLOY_KEY }}
        port: ${{ secrets.JUDGE_DEPLOY_PORT || 22 }}
        envs: JUDGE_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying judge-service to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading judge-service image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/judge-service-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/judge-service-image.tar.gz

          echo "Starting judge-service..."
          export JUDGE_IMAGE="${JUDGE_IMAGE}"
          docker compose --profile judge up -d --remove-orphans

          echo "Judge-service deployment completed!"
      env:
        JUDGE_IMAGE: bluenet-judge-service:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署 AI 服务阶段 ====================

  deploy-ai-service:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-ai-service, deploy-database-infra]

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.AI_DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.AI_DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.AI_DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.AI_DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download ai-service image artifact
      uses: actions/download-artifact@v4
      with:
        name: ai-service-image
        path: ./images

    - name: Sync compose file to ai server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.AI_DEPLOY_USER }}
        key: ${{ secrets.AI_DEPLOY_KEY }}
        port: ${{ secrets.AI_DEPLOY_PORT || 22 }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.AI_DEPLOY_USER }}
        key: ${{ secrets.AI_DEPLOY_KEY }}
        port: ${{ secrets.AI_DEPLOY_PORT || 22 }}
        source: "images/ai-service-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy ai-service via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.AI_DEPLOY_USER }}
        key: ${{ secrets.AI_DEPLOY_KEY }}
        port: ${{ secrets.AI_DEPLOY_PORT || 22 }}
        envs: AI_SERVICE_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH
          echo "=== Deploying ai-service to ${{ steps.vars.outputs.env_name }} environment ==="
          echo "Loading ai-service image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/ai-service-image.tar.gz | docker load
          rm -f /tmp/bluenet-deploy/images/ai-service-image.tar.gz
          echo "Starting ai-service..."
          export AI_SERVICE_IMAGE="${AI_SERVICE_IMAGE}"
          docker compose --profile app up -d ai-service --remove-orphans
          echo "Ai-service deployment completed!"
      env:
        AI_SERVICE_IMAGE: bluenet-ai-service:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 健康检查阶段 ====================

  health-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [deploy-api-service, deploy-judge-service, deploy-ai-service]
    timeout-minutes: 5

    steps:
    # 按分支选择构建/健康检查变量：master 读 *_PROD，develop 读 *_DEV，
    # 均未配置时回退到旧的不分环境变量（BACKEND_HOST 等），保证平滑迁移
    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "backend_host=${{ vars.BACKEND_HOST_PROD || vars.BACKEND_HOST }}" >> $GITHUB_OUTPUT
          echo "backend_port=${{ vars.BACKEND_PORT_PROD || vars.BACKEND_PORT }}" >> $GITHUB_OUTPUT
          echo "ssl_enabled=${{ vars.SSL_ENABLED_PROD || vars.SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_host=${{ vars.AI_SERVICE_HOST_PROD || vars.AI_SERVICE_HOST }}" >> $GITHUB_OUTPUT
          echo "ai_port=${{ vars.AI_SERVICE_PORT_PROD || vars.AI_SERVICE_PORT }}" >> $GITHUB_OUTPUT
          echo "ai_ssl_enabled=${{ vars.AI_SERVICE_SSL_ENABLED_PROD || vars.AI_SERVICE_SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "judge_host=${{ secrets.JUDGE_DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
        else
          echo "backend_host=${{ vars.BACKEND_HOST_DEV || vars.BACKEND_HOST }}" >> $GITHUB_OUTPUT
          echo "backend_port=${{ vars.BACKEND_PORT_DEV || vars.BACKEND_PORT }}" >> $GITHUB_OUTPUT
          echo "ssl_enabled=${{ vars.SSL_ENABLED_DEV || vars.SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_host=${{ vars.AI_SERVICE_HOST_DEV || vars.AI_SERVICE_HOST }}" >> $GITHUB_OUTPUT
          echo "ai_port=${{ vars.AI_SERVICE_PORT_DEV || vars.AI_SERVICE_PORT }}" >> $GITHUB_OUTPUT
          echo "ai_ssl_enabled=${{ vars.AI_SERVICE_SSL_ENABLED_DEV || vars.AI_SERVICE_SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "judge_host=${{ secrets.JUDGE_DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
        fi

    - name: Wait for api-service health check
      run: |
        PROTOCOL="${{ steps.vars.outputs.ssl_enabled == 'true' && 'https' || 'http' }}"
        URL="${PROTOCOL}://${{ steps.vars.outputs.backend_host }}:${{ steps.vars.outputs.backend_port }}/api/v1/health"
        echo "Waiting for api-service at $URL to be healthy..."

        for i in {1..30}; do
          RESPONSE=$(curl -sfL "$URL" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✅ Api-service is healthy!"
            echo "Response: $RESPONSE"
            exit 0
          fi
          echo "Waiting for api-service... ($i/30)"
          sleep 10
        done

        echo "❌ Api-service health check failed after 5 minutes"
        exit 1

    - name: Wait for judge-service health check
      run: |
        URL="http://${{ steps.vars.outputs.judge_host }}:8090/api/v1/judge/health"
        echo "Waiting for judge-service at $URL to be healthy..."

        for i in {1..30}; do
          RESPONSE=$(curl -sfL "$URL" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"status":"UP"'; then
            echo "✅ Judge-service is healthy!"
            echo "Response: $RESPONSE"
            exit 0
          fi
          echo "Waiting for judge-service... ($i/30)"
          sleep 10
        done

        echo "❌ Judge-service health check failed after 5 minutes"
        exit 1

    - name: Wait for ai-service health check
      run: |
        PROTOCOL="${{ steps.vars.outputs.ai_ssl_enabled == 'true' && 'https' || 'http' }}"
        URL="${PROTOCOL}://${{ steps.vars.outputs.ai_host }}:${{ steps.vars.outputs.ai_port }}/ai/v1/health"
        echo "Waiting for ai-service at $URL to be healthy..."

        for i in {1..30}; do
          RESPONSE=$(curl -sfL "$URL" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "✅ Ai-service is healthy!"
            echo "Response: $RESPONSE"
            exit 0
          fi
          echo "Waiting for ai-service... ($i/30)"
          sleep 10
        done

        echo "❌ Ai-service health check failed after 5 minutes"
        exit 1

  # ==================== 构建前端阶段 ====================

  build-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend-test, health-check]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "backend_host=${{ vars.BACKEND_HOST_PROD || vars.BACKEND_HOST }}" >> $GITHUB_OUTPUT
          echo "backend_port=${{ vars.BACKEND_PORT_PROD || vars.BACKEND_PORT }}" >> $GITHUB_OUTPUT
          echo "ssl_enabled=${{ vars.SSL_ENABLED_PROD || vars.SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_host=${{ vars.AI_SERVICE_HOST_PROD || vars.AI_SERVICE_HOST }}" >> $GITHUB_OUTPUT
          echo "ai_port=${{ vars.AI_SERVICE_PORT_PROD || vars.AI_SERVICE_PORT }}" >> $GITHUB_OUTPUT
          echo "ai_ssl_enabled=${{ vars.AI_SERVICE_SSL_ENABLED_PROD || vars.AI_SERVICE_SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_prefix=${{ vars.AI_SERVICE_PREFIX_PROD || vars.AI_SERVICE_PREFIX }}" >> $GITHUB_OUTPUT
        else
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "backend_host=${{ vars.BACKEND_HOST_DEV || vars.BACKEND_HOST }}" >> $GITHUB_OUTPUT
          echo "backend_port=${{ vars.BACKEND_PORT_DEV || vars.BACKEND_PORT }}" >> $GITHUB_OUTPUT
          echo "ssl_enabled=${{ vars.SSL_ENABLED_DEV || vars.SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_host=${{ vars.AI_SERVICE_HOST_DEV || vars.AI_SERVICE_HOST }}" >> $GITHUB_OUTPUT
          echo "ai_port=${{ vars.AI_SERVICE_PORT_DEV || vars.AI_SERVICE_PORT }}" >> $GITHUB_OUTPUT
          echo "ai_ssl_enabled=${{ vars.AI_SERVICE_SSL_ENABLED_DEV || vars.AI_SERVICE_SSL_ENABLED }}" >> $GITHUB_OUTPUT
          echo "ai_prefix=${{ vars.AI_SERVICE_PREFIX_DEV || vars.AI_SERVICE_PREFIX }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/bluenet-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Debug vars values
      run: |
        echo "=== 前端构建时变量 ==="
        echo "BACKEND_HOST=${{ steps.vars.outputs.backend_host }}"
        echo "BACKEND_PORT=${{ steps.vars.outputs.backend_port }}"
        echo "SSL_ENABLED=${{ steps.vars.outputs.ssl_enabled }}"
        echo "AI_SERVICE_HOST=${{ steps.vars.outputs.ai_host }}"
        echo "AI_SERVICE_PORT=${{ steps.vars.outputs.ai_port }}"

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/frontend.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          CACHE_BUST=${{ github.sha }}_${{ github.run_id }}
          BUILD_BACKEND_HOST=${{ steps.vars.outputs.backend_host }}
          BUILD_BACKEND_PORT=${{ steps.vars.outputs.backend_port }}
          BUILD_SSL_ENABLED=${{ steps.vars.outputs.ssl_enabled }}
          NEXT_PUBLIC_BACKEND_HOST=${{ steps.vars.outputs.backend_host }}
          NEXT_PUBLIC_BACKEND_PORT=${{ steps.vars.outputs.backend_port }}
          NEXT_PUBLIC_SSL_ENABLED=${{ steps.vars.outputs.ssl_enabled }}
          NEXT_PUBLIC_AI_SERVICE_HOST=${{ steps.vars.outputs.ai_host }}
          NEXT_PUBLIC_AI_SERVICE_PORT=${{ steps.vars.outputs.ai_port || '8000' }}
          NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED=${{ steps.vars.outputs.ai_ssl_enabled }}
          NEXT_PUBLIC_AI_SERVICE_PREFIX=${{ steps.vars.outputs.ai_prefix || '/ai/v1' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push frontend image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save frontend image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/bluenet-frontend:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-frontend:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > frontend-image.tar.gz

    - name: Upload frontend image artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-image
        path: frontend-image.tar.gz
        retention-days: 1

  # ==================== 部署前端阶段 ====================

  deploy-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-frontend]

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download frontend image artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-image
        path: ./images

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        source: "images/frontend-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy frontend via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        envs: FRONTEND_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying frontend to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading frontend image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/frontend-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/frontend-image.tar.gz

          echo "Starting frontend service..."
          docker compose --profile app up -d --no-deps frontend --remove-orphans

          echo "Cleaning up old images..."
          docker image prune -f

          echo "✅ Deployment to ${{ steps.vars.outputs.env_name }} completed successfully!"
      env:
        FRONTEND_IMAGE: bluenet-frontend:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}
