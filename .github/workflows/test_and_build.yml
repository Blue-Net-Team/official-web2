# CI/CD Pipeline 工作流
# 支持多分支部署：master -> 生产环境，develop -> 开发环境
# 分阶段部署：基础设施 -> 后端/判题服务 -> 健康检查 -> 前端
# 部署方式：构建镜像后 docker save -> SCP 传输到服务器 -> docker load 导入（避免国内服务器 pull ghcr.io 超时）

name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== 测试阶段 ====================

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Compile backend
      run: ./mvnw -B clean compile

    - name: Run backend tests
      run: ./mvnw -B test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: src/frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: TypeScript check
      run: npx tsc --noEmit

    - name: Lint check
      run: pnpm lint

  # ==================== 测试判题服务阶段 ====================

  judge-service-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Make mvnw executable
      run: chmod +x src/backend/mvnw

    - name: Compile judge-service
      run: src/backend/mvnw -B clean compile -f src/judge-service/pom.xml

    - name: Run judge-service tests
      run: src/backend/mvnw -B test -f src/judge-service/pom.xml

  # ==================== 构建后端阶段 ====================

  build-backend:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('src/backend/**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build backend JAR
      working-directory: src/backend
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests -B

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/backend.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push backend image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save backend image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-backend:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-backend:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > backend-image.tar.gz

    - name: Upload backend image artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-image
        path: backend-image.tar.gz
        retention-days: 1

  # ==================== 构建判题服务阶段 ====================

  build-judge-service:
    runs-on: ubuntu-latest
    needs: [judge-service-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build judge-service JAR
      run: |
        chmod +x src/backend/mvnw
        src/backend/mvnw clean package -DskipTests -B -f src/judge-service/pom.xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-judge-service
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build judge-service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/judge-service.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push judge-service image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save judge-service image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/bluenet-judge-service:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-judge-service:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > judge-service-image.tar.gz

    - name: Upload judge-service image artifact
      uses: actions/upload-artifact@v4
      with:
        name: judge-service-image
        path: judge-service-image.tar.gz
        retention-days: 1

  # ==================== 部署基础设施阶段 ====================

  deploy-infra:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, judge-service-test]
    if: github.event_name == 'push'
    outputs:
      deploy_host: ${{ steps.vars.outputs.deploy_host }}

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Sync compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Deploy infrastructure via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying infrastructure to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Starting infrastructure services (database, redis, rabbitmq)..."
          docker compose --profile infra up -d --remove-orphans

          echo "Infrastructure deployment completed!"
      env:
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署后端阶段 ====================

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-backend, deploy-infra]
    if: github.event_name == 'push'
    outputs:
      deploy_host: ${{ steps.vars.outputs.deploy_host }}

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download backend image artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-image
        path: ./images

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        source: "images/backend-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy backend via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: BACKEND_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying api-service to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading api-service image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/backend-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/backend-image.tar.gz

          echo "Starting api-service..."
          docker compose up -d api-service --remove-orphans

          echo "Api-service deployment completed!"
      env:
        BACKEND_IMAGE: bluenet-backend:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 部署判题服务阶段 ====================

  deploy-judge-service:
    runs-on: ubuntu-latest
    needs: [build-judge-service, deploy-infra]
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download judge-service image artifact
      uses: actions/download-artifact@v4
      with:
        name: judge-service-image
        path: ./images

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        source: "images/judge-service-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy judge-service via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: JUDGE_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying judge-service to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading judge-service image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/judge-service-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/judge-service-image.tar.gz

          echo "Starting judge-service..."
          docker compose up -d judge-service --remove-orphans

          echo "Judge-service deployment completed!"
      env:
        JUDGE_IMAGE: bluenet-judge-service:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}

  # ==================== 健康检查阶段 ====================

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-judge-service]
    if: github.event_name == 'push'
    timeout-minutes: 5

    steps:
    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
        else
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
        fi

    - name: Wait for backend health check
      run: |
        HOST="${{ steps.vars.outputs.deploy_host }}"
        echo "Waiting for backend at $HOST:8080 to be healthy..."

        for i in {1..30}; do
          RESPONSE=$(curl -sf http://$HOST:8080/api/v1/health 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"code":200'; then
            echo "✅ Backend is healthy!"
            echo "Response: $RESPONSE"
            exit 0
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 10
        done

        echo "❌ Backend health check failed after 5 minutes"
        exit 1

  # ==================== 构建前端阶段 ====================

  build-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test, health-check]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set image name
      id: image
      run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
        else
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/bluenet-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/frontend.Dockerfile
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_BACKEND_HOST=${{ steps.vars.outputs.deploy_host }}
          BUILD_BACKEND_PORT=8080
          NEXT_PUBLIC_BACKEND_HOST=${{ steps.vars.outputs.deploy_host }}
          NEXT_PUBLIC_BACKEND_PORT=8080
          NEXT_PUBLIC_SSL_ENABLED=false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push frontend image to ghcr.io
      run: |
        echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
          [ -n "$tag" ] && docker push "$tag"
        done

    - name: Save frontend image as tar
      run: |
        IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
        GHCR_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/bluenet-frontend:${IMAGE_TAG}"
        LOCAL_TAG="bluenet-frontend:${IMAGE_TAG}"
        docker tag "$GHCR_IMAGE" "$LOCAL_TAG"
        docker save "$LOCAL_TAG" | gzip > frontend-image.tar.gz

    - name: Upload frontend image artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-image
        path: frontend-image.tar.gz
        retention-days: 1

  # ==================== 部署前端阶段 ====================

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [ "${{ github.ref }}" = "refs/heads/master" ]; then
          echo "deploy_path=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_PROD }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "env_name=production" >> $GITHUB_OUTPUT
        else
          echo "deploy_path=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          echo "deploy_host=${{ secrets.DEPLOY_HOST_DEV }}" >> $GITHUB_OUTPUT
          echo "image_tag=develop" >> $GITHUB_OUTPUT
          echo "env_name=development" >> $GITHUB_OUTPUT
        fi

    - name: Download frontend image artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-image
        path: ./images

    - name: Transfer image to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        source: "images/frontend-image.tar.gz"
        target: /tmp/bluenet-deploy

    - name: Deploy frontend via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        envs: FRONTEND_IMAGE, DEPLOY_PATH
        script: |
          cd $DEPLOY_PATH

          echo "=== Deploying frontend to ${{ steps.vars.outputs.env_name }} environment ==="

          echo "Loading frontend image from tar..."
          gunzip -c /tmp/bluenet-deploy/images/frontend-image.tar.gz | docker load

          rm -f /tmp/bluenet-deploy/images/frontend-image.tar.gz

          echo "Starting frontend service..."
          docker compose up -d --no-deps frontend --remove-orphans

          echo "Cleaning up old images..."
          docker image prune -f

          echo "✅ Deployment to ${{ steps.vars.outputs.env_name }} completed successfully!"
      env:
        FRONTEND_IMAGE: bluenet-frontend:${{ steps.vars.outputs.image_tag }}
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}
