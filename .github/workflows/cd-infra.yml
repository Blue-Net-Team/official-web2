# CD Infra：基础服务（PostgreSQL / Redis / RabbitMQ）Helm 发布到 k3s
# 全面 helm 部署，不使用 SSH/compose。
# trigger/infra 仅作存在性开关；基础镜像为一次性中转（见 deploy/scripts/README.md），CI 不构建。
#
# 三个基础服务均为有状态单副本：nodeSelector 由 values 固定（db / mq 节点），
# 因此每个 release 的调度位置不依赖 Pod 调度随机性。

name: CD Infra

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prod, dev]
        default: dev

permissions:
  contents: read

jobs:
  check-trigger:
    name: Check trigger/infra
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
    - uses: actions/checkout@v4
    - name: Resolve deployment variables
      id: check
      run: |
        if [ -f trigger/infra ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "trigger/infra 存在，启用基础设施部署"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "trigger/infra 不存在，跳过基础设施部署"
        fi

  postgres:
    name: Deploy postgres to k3s (Helm)
    needs: check-trigger
    if: needs.check-trigger.outputs.enabled == 'true'
    uses: ./.github/workflows/cd-helm-deploy.yml
    secrets: inherit
    with:
      service: postgres
      kind: StatefulSet
      image_source: base
      image_tag: pgvector-pg17
      environment: ${{ inputs.environment }}

  redis:
    name: Deploy redis to k3s (Helm)
    needs: check-trigger
    if: needs.check-trigger.outputs.enabled == 'true'
    uses: ./.github/workflows/cd-helm-deploy.yml
    secrets: inherit
    with:
      service: redis
      kind: StatefulSet
      image_source: base
      image_tag: redis-7
      environment: ${{ inputs.environment }}

  rabbitmq:
    name: Deploy rabbitmq to k3s (Helm)
    needs: check-trigger
    if: needs.check-trigger.outputs.enabled == 'true'
    uses: ./.github/workflows/cd-helm-deploy.yml
    secrets: inherit
    with:
      service: rabbitmq
      kind: StatefulSet
      image_source: base
      image_tag: rabbitmq-3-management
      environment: ${{ inputs.environment }}
