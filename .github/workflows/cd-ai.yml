# CD AI 可复用工作流：拉取镜像 → 推送阿里云 ACR → 服务器 docker pull → compose up → 轮询健康

name: CD AI

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [prod, dev]
        default: dev
      image_tag:
        type: string
        description: '镜像 tag（留空 = latest(prod) / develop(dev)）'
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve deployment variables
      id: vars
      run: |
        ENV="${{ inputs.environment }}"
        TAG="${{ inputs.image_tag }}"
        if [ "$ENV" = "prod" ]; then
          echo "deploy_host=${{ secrets.AI_DEPLOY_HOST_PROD || secrets.DEPLOY_HOST_PROD }}" >> "$GITHUB_OUTPUT"
          echo "deploy_path=${{ secrets.AI_DEPLOY_PATH_PROD || secrets.DEPLOY_PATH_PROD }}" >> "$GITHUB_OUTPUT"
          [ -z "$TAG" ] && TAG=latest
        else
          echo "deploy_host=${{ secrets.AI_DEPLOY_HOST_DEV || secrets.DEPLOY_HOST_DEV }}" >> "$GITHUB_OUTPUT"
          echo "deploy_path=${{ secrets.AI_DEPLOY_PATH_DEV || secrets.DEPLOY_PATH_DEV }}" >> "$GITHUB_OUTPUT"
          [ -z "$TAG" ] && TAG=develop
        fi
        echo "deploy_user=${{ secrets.AI_DEPLOY_USER || secrets.DEPLOY_USER }}" >> "$GITHUB_OUTPUT"
        echo "deploy_port=${{ secrets.AI_DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}" >> "$GITHUB_OUTPUT"
        echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "env_name=$ENV" >> "$GITHUB_OUTPUT"

    - name: Set image name
      id: image
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull ai-service image from ghcr
      run: |
        IMAGE="ghcr.io/${{ steps.image.outputs.name }}/bluenet-ai-service:${{ steps.vars.outputs.image_tag }}"
        echo "Pulling $IMAGE"
        docker pull "$IMAGE"

    - name: Login to Aliyun ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_REPO }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PWD }}
    - name: Tag and push image to Aliyun ACR
      run: |
        GHCR_IMAGE="ghcr.io/${{ steps.image.outputs.name }}/bluenet-ai-service:${{ steps.vars.outputs.image_tag }}"
        ACR_IMAGE="${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/bluenet:ai"
        echo "Pushing $ACR_IMAGE"
        docker tag "$GHCR_IMAGE" "$ACR_IMAGE"
        docker push "$ACR_IMAGE"

    - name: Sync compose file to ai server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ steps.vars.outputs.deploy_user }}
        key: ${{ secrets.AI_DEPLOY_KEY || secrets.DEPLOY_KEY }}
        port: ${{ steps.vars.outputs.deploy_port }}
        source: "docker/docker-compose.yml"
        target: ${{ steps.vars.outputs.deploy_path }}
        strip_components: 1

    - name: Deploy ai-service via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.vars.outputs.deploy_host }}
        username: ${{ steps.vars.outputs.deploy_user }}
        key: ${{ secrets.AI_DEPLOY_KEY || secrets.DEPLOY_KEY }}
        port: ${{ steps.vars.outputs.deploy_port }}
        envs: AI_SERVICE_IMAGE, DEPLOY_PATH, IMAGE_ENV, ACR_REPO, ACR_USERNAME, ACR_PWD
        script: |
          set -e
          cd $DEPLOY_PATH
          echo "=== Deploying ai-service to ${{ steps.vars.outputs.env_name }} ==="
          echo "Logging into Aliyun ACR..."
          echo "$ACR_PWD" | docker login --username="$ACR_USERNAME" "$ACR_REPO" --password-stdin
          echo "Pulling image $IMAGE_ENV..."
          docker pull "$IMAGE_ENV"
          export AI_SERVICE_IMAGE="$IMAGE_ENV"
          docker compose --profile ai up -d --no-deps ai-service --remove-orphans
          echo "ai-service deployment completed!"
      env:
        IMAGE_ENV: ${{ secrets.ACR_REPO }}/${{ secrets.ACR_NAMESPACE }}/bluenet:ai
        DEPLOY_PATH: ${{ steps.vars.outputs.deploy_path }}
        ACR_REPO: ${{ secrets.ACR_REPO }}
        ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        ACR_PWD: ${{ secrets.ACR_PWD }}

    - name: Wait for ai-service health check
      run: |
        PROTOCOL="${{ vars.AI_SERVICE_SSL_ENABLED == 'true' && 'https' || 'http' }}"
        URL="${PROTOCOL}://${{ vars.AI_SERVICE_HOST }}:${{ vars.AI_SERVICE_PORT }}/ai/v1/health"
        echo "Waiting for ai-service at $URL to be healthy..."
        for i in {1..30}; do
          RESPONSE=$(curl -sfL "$URL" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "✅ Ai-service is healthy!"
            exit 0
          fi
          echo "Waiting... ($i/30)"
          sleep 10
        done
        echo "❌ Ai-service health check failed after 5 minutes"
        exit 1
