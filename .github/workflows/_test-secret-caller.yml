# 临时诊断：对比 secrets:inherit 有无
name: Test Secret Caller
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  with-inherit:
    uses: ./.github/workflows/_test-secret.yml
    with:
      label: WITH_INHERIT
    secrets: inherit
  without-inherit:
    uses: ./.github/workflows/_test-secret.yml
    with:
      label: WITHOUT_INHERIT
