{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluenet.name" . }}
  labels:
    {{- include "bluenet.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
      {{- if and (eq $.Values.service.type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "bluenet.selectorLabels" . | nindent 4 }}
{{- if and (eq .Values.kind "StatefulSet") .Values.service.headless }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bluenet.name" . }}-headless
  labels:
    {{- include "bluenet.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "bluenet.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
