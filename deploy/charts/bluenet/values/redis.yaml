# Redis —— 有状态，钉在 bluenet/role=db 节点
# release: helm upgrade --install bluenet-redis deploy/charts/bluenet -f .../values/redis.yaml

fullnameOverride: bluenet-redis
kind: StatefulSet
containerName: redis
replicas: 1
persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  mountPath: /data

image:
  repository: "<ACR-ADDRESS>/<BASE-NAMESPACE>/<BASE-REPO>"
  tag: redis-7
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: NodePort        # 供 nginx 转发
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379

command: ["sh", "-c"]
args:
  - |
    set -e
    if [ -n "${REDIS_PASSWORD}" ]; then
      exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD}"
    else
      exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    fi

env:
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: bluenet-redis
        key: redis-password
  - name: TZ
    value: Asia/Shanghai

volumeMounts:
  - name: data
    mountPath: /data

probes:
  liveness:
    exec:
      command: ["sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    exec:
      command: ["sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
    initialDelaySeconds: 5
    periodSeconds: 10

nodeSelector:
  bluenet/role: db

resources:
  requests:
    memory: 64Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 300m
