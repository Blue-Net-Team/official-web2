# api-service 本地五节点 kind 配置。
# 镜像由 Docker Desktop containerd 直接共享；对象存储使用集群内 RustFS。
# 外部入口为 https://bluenet.local，密钥统一引用预建 Secret。

fullnameOverride: bluenet-api
kind: Deployment
containerName: api
replicas: 2

image:
  repository: bluenet-api-service
  tag: 1.2.0-local-e64b82d4
  pullPolicy: IfNotPresent

strategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

extraContainerPorts:
  - name: management
    containerPort: 8081
    protocol: TCP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: /actuator/prometheus

service:
  enabled: true
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bluenet-api
              app.kubernetes.io/instance: bluenet-api

env:
  - name: MANAGEMENT_SERVER_PORT
    value: "8081"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,prometheus
  - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED
    value: "true"

  - name: DATABASE_HOST
    value: bluenet-postgres
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: db_blue_net
  - name: DATABASE_USERNAME
    value: postgres
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef: { name: bluenet-postgres, key: postgres-password }

  - name: REDIS_HOST
    value: bluenet-redis
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: bluenet-redis, key: redis-password }

  - name: RABBITMQ_HOST
    value: bluenet-rabbitmq
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    valueFrom:
      secretKeyRef: { name: bluenet-rabbitmq, key: username }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: bluenet-rabbitmq, key: password }

  - name: STORAGE_PROVIDER
    value: minio
  - name: STORAGE_BUCKET
    value: bluenet-dev
  - name: JUDGE_STORAGE_BUCKET
    value: bluenet-judge-dev
  - name: MINIO_ENDPOINT
    value: bluenet-rustfs
  - name: MINIO_PORT
    value: "9000"
  - name: MINIO_PUBLIC_URL
    value: "https://s3.bluenet.local"
  - name: MINIO_USE_SSL
    value: "false"
  - name: MINIO_AK
    valueFrom:
      secretKeyRef: { name: bluenet-rustfs, key: access-key }
  - name: MINIO_SK
    valueFrom:
      secretKeyRef: { name: bluenet-rustfs, key: secret-key }

  - name: JWT_SECRET
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: jwt-secret }
  - name: COOKIE_DOMAIN
    # 跟随当前主机，兼容 bluenet.local 浏览器与 localhost k6 隔离压测。
    value: ""
  - name: COOKIE_SECURE
    value: "true"
  - name: COOKIE_SAME_SITE
    value: Lax
  - name: COOKIE_MAX_AGE
    value: "43200"
  - name: CORS_ALLOWED_ORIGINS
    value: "https://bluenet.local"

  - name: SYSTEM_USER_USERNAME
    value: system
  - name: SYSTEM_USER_PASSWORD
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: system-user-password }
  - name: SYSTEM_USER_STUDENT_ID
    value: "000000000000"
  - name: MAIL_USERNAME
    value: "gdou_bluenet@163.com"
  - name: MAIL_PASSWORD
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: mail-password }

  - name: GITHUB_CLIENT_ID
    value: "Ov23liUx8DSqRIo6WT86"
  - name: GITHUB_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: github-client-secret }
  - name: GITHUB_OAUTH_CALLBACK_BASE_URL
    value: "https://bluenet.local"
  - name: GITHUB_FRONTEND_BASE_URL
    value: "https://bluenet.local"

  - name: GITHUB_ISSUE_APP_ID
    value: "3615796"
  - name: GITHUB_ISSUE_PRIVATE_KEY_PATH
    value: /app/github-issue-private-key.pem
  - name: GITHUB_APP_OWNER
    value: "Blue-Net-Team"
  - name: GITHUB_APP_REPO
    value: "official-web2"
  - name: GITHUB_APP_APP_BASE_URL
    value: "https://bluenet.local"
  - name: GITHUB_APP_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: github-app-webhook-secret }
  - name: GITHUB_APP_POLLING_ENABLED
    value: "true"
  - name: GITHUB_APP_POLLING_SINCE_DAYS
    value: "7"
  - name: GITHUB_ISSUE_SYNC_CRON
    value: "0 0 3 * * *"

  - name: GITHUB_ORG_APP_ID
    value: "4484778"
  - name: GITHUB_ORG_PRIVATE_KEY_PATH
    value: /app/github-org-private-key.pem

  - name: WPS_BIND_CODE
    valueFrom:
      secretKeyRef: { name: bluenet-api-secret, key: wps-bind-code }
  - name: ELIMINATED_USER_DISABLE_CRON
    value: "0 0 3 * * *"
  - name: ORPHAN_FILE_CLEANUP_CRON
    value: "0 0 2 * * *"
  - name: TZ
    value: Asia/Shanghai

volumes:
  - name: github-keys
    secret:
      secretName: bluenet-github-keys
      defaultMode: 0444
volumeMounts:
  - name: github-keys
    mountPath: /app/github-issue-private-key.pem
    subPath: github-issue-private-key.pem
    readOnly: true
  - name: github-keys
    mountPath: /app/github-org-private-key.pem
    subPath: github-org-private-key.pem
    readOnly: true

probes:
  startup:
    httpGet: { path: /api/v1/health, port: 8080 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    httpGet: { path: /api/v1/health, port: 8080 }
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    httpGet: { path: /api/v1/health, port: 8080 }
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: "1"
