# PostgreSQL (pgvector) 本地配置；固定到 bluenet/role=db 节点。

fullnameOverride: bluenet-postgres
kind: StatefulSet
containerName: postgres
replicas: 1
persistence:
  enabled: true
  storageClassName: hostpath
  size: 8Gi
  mountPath: /var/lib/postgresql/data

image:
  repository: pgvector/pgvector
  tag: pg17
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: NodePort
  headless: false
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432

args:
  - "-c"
  - "shared_buffers=256MB"
  - "-c"
  - "max_connections=100"
  - "-c"
  - "work_mem=8MB"
  - "-c"
  - "maintenance_work_mem=64MB"
  - "-c"
  - "effective_cache_size=768MB"
  - "-c"
  - "log_min_duration_statement=1000"

env:
  - name: POSTGRES_DB
    value: db_blue_net
  - name: POSTGRES_USER
    value: postgres
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: bluenet-postgres
        key: postgres-password
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata
  - name: TZ
    value: Asia/Shanghai

volumeMounts:
  - name: data
    mountPath: /var/lib/postgresql/data
  - name: shm
    mountPath: /dev/shm
volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 256Mi

probes:
  liveness:
    exec:
      command: ["sh", "-c", "pg_isready -U postgres -d db_blue_net"]
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
  readiness:
    exec:
      command: ["sh", "-c", "pg_isready -U postgres -d db_blue_net"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

nodeSelector:
  bluenet/role: db

resources:
  requests:
    memory: 512Mi
    cpu: 300m
  limits:
    memory: 1200Mi
    cpu: "1"

terminationGracePeriodSeconds: 60
