# frontend（Next.js SSR，无状态，NodePort 30000 供 nginx 转发）
# release: helm upgrade --install bluenet-frontend deploy/charts/bluenet -f .../values/frontend.yaml
#
# 注意：NEXT_PUBLIC_* 为构建期注入（CI build args），此处保留运行时值以防 SSR 读取

fullnameOverride: bluenet-frontend
kind: Deployment
containerName: frontend
replicas: 1

image:
  repository: "<ACR-ADDRESS>/<SERVICE-NAMESPACE>/<SERVICE-REPO>"
  tag: frontend-<VERSION>            # 不可变 tag：<服务名>-<trigger版本号>，由 CI 注入
  pullPolicy: IfNotPresent

strategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

service:
  enabled: true
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bluenet-frontend
              app.kubernetes.io/instance: bluenet-frontend

env:
  # SSR 服务端访问后端：走集群内 Service DNS
  - name: BACKEND_HOST
    value: bluenet-api
  - name: BACKEND_PORT
    value: "8080"
  - name: SSL_ENABLED
    value: "false"
  - name: API_PREFIX
    value: /api/v1
  # 浏览器侧（构建期已注入，运行时保留同值）
  - name: NEXT_PUBLIC_BACKEND_HOST
    value: "www.gdou-bluenet.cn"
  - name: NEXT_PUBLIC_BACKEND_PORT
    value: "443"
  - name: NEXT_PUBLIC_SSL_ENABLED
    value: "true"
  - name: NEXT_PUBLIC_API_PREFIX
    value: /api/v1
  - name: NEXT_PUBLIC_AI_SERVICE_HOST
    value: "www.gdou-bluenet.cn"
  - name: NEXT_PUBLIC_AI_SERVICE_PORT
    value: "443"
  - name: NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED
    value: "true"
  - name: NEXT_PUBLIC_AI_SERVICE_PREFIX
    value: /ai/v1
  # 限制 V8 堆，避免按整机内存放大
  - name: NODE_OPTIONS
    value: "--max-old-space-size=384"
  - name: TZ
    value: Asia/Shanghai

probes:
  liveness:
    tcpSocket: { port: 3000 }
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
  readiness:
    tcpSocket: { port: 3000 }
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5

resources:
  requests:
    memory: 384Mi
    cpu: 200m
  limits:
    memory: 640Mi
    cpu: 500m
