apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-observability
  namespace: bluenet
  labels:
    app.kubernetes.io/part-of: bluenet-local-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-observability
  labels:
    app.kubernetes.io/part-of: bluenet-local-observability
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/proxy", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-observability
  labels:
    app.kubernetes.io/part-of: bluenet-local-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-observability
subjects:
  - kind: ServiceAccount
    name: local-observability
    namespace: bluenet
