# 生产环境配置

# Cookie 配置（生产环境）
cookie:
  # 跨子域时设置为 .example.com（如 .bluenet.com）
  domain: ${COOKIE_DOMAIN:}
  # 生产环境必须使用 HTTPS，Secure=true
  secure: true
  same-site: Lax
  max-age: 43200

# CORS 配置（生产环境）
cors:
  # 生产环境必须配置具体域名
  # 示例：https://bluenet.com,https://www.bluenet.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Object storage configuration
storage:
  enabled: true
  provider: ${STORAGE_PROVIDER:aliyun-oss}
  bucket: ${STORAGE_BUCKET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    port: ${MINIO_PORT:9000}
    accessKey: ${MINIO_AK:}
    secretKey: ${MINIO_SK:}
    useSSL: ${MINIO_USE_SSL:true}
  aliyun-oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_AK:}
    accessKeySecret: ${ALIYUN_OSS_SK:}
