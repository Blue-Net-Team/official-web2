# 应用服务 WEB 访问端口
server:
  port: 8080
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true

spring:
  profiles:
    active: "@spring.profiles.active@"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db_blue_net}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:000000}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_USERNAME:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:bluenet123}
mybatis-plus:
  mapper-locations: classpath:infrastructure/repository/mapper/*.xml
  type-aliases-package: com.bluenet.web.domain.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.bluenet.web.infrastructure.repository.handler.ValueEnumTypeHandler

# Object storage configuration
storage:
  enabled: true
  provider: ${STORAGE_PROVIDER:minio}
  bucket: ${STORAGE_BUCKET:bluenet}
  minio:
    endpoint: ${MINIO_ENDPOINT:localhost}
    port: ${MINIO_PORT:9000}
    accessKey: ${MINIO_AK:admin}
    secretKey: ${MINIO_SK:admin1234}
    useSSL: ${MINIO_USE_SSL:false}
    publicUrl: ${MINIO_PUBLIC_URL:}
  aliyun-oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_AK:}
    accessKeySecret: ${ALIYUN_OSS_SK:}
    publicEndpoint: ${ALIYUN_OSS_PUBLIC_ENDPOINT:}

# 定时任务配置
job:
  orphan-file-cleanup:
    cron: "${ORPHAN_FILE_CLEANUP_CRON:0 0 2 * * *}"
  eliminated-user-disable:
    cron: "${ELIMINATED_USER_DISABLE_CRON:0 0 3 * * *}"

# Judge assets use an isolated bucket and must not be exposed through candidate file APIs.
judge:
  storage:
    bucket: ${JUDGE_STORAGE_BUCKET:bluenet-judge}

# springdoc-openapi
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# JWT配置
jwt:
  # 密钥（移除连字符以避免潜在问题，且长度满足安全要求）
  secret: ${JWT_SECRET:BlueNetWeb21BackendJwtSecretKey20260215NoHyphensAllowed}
  # 过期时间（秒），12小时 = 43200秒
  expiration: 43200

# 系统用户配置
system-user:
  username: ${SYSTEM_USER_USERNAME:system}
  password: ${SYSTEM_USER_PASSWORD:admin123}
  student-id: ${SYSTEM_USER_STUDENT_ID:000000000000}

# Cookie 配置
cookie:
  # Cookie Domain，跨子域时设置为 .example.com
  domain: ${COOKIE_DOMAIN:}
  # Secure 属性，生产环境必须为 true
  secure: ${COOKIE_SECURE:false}
  # SameSite 属性，推荐 Lax
  same-site: ${COOKIE_SAME_SITE:Lax}
  # Cookie 有效期（秒），12小时 = 43200秒，与 JWT 一致
  max-age: ${COOKIE_MAX_AGE:43200}
  # Cookie Path
  path: /
  # 认证 Cookie 名称
  auth-cookie-name: auth_token
  # CSRF Cookie 名称
  csrf-cookie-name: csrf_token

# GitHub OAuth 配置
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    callback-base-url: ${GITHUB_OAUTH_CALLBACK_BASE_URL:http://localhost:8080}
    frontend-base-url: ${GITHUB_FRONTEND_BASE_URL:http://localhost:3000}
  app:    # github app 用于自动同步bug issue
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    owner: ${GITHUB_APP_OWNER:}
    repo: ${GITHUB_APP_REPO:}
    app-base-url: ${GITHUB_APP_APP_BASE_URL:http://localhost:8080}

# CORS 配置
cors:
  # 允许的前端域名，多个用逗号分隔
  # 生产环境应配置具体域名，如: https://example.com,https://www.example.com
  # 开发环境可使用 * 允许所有域名
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Actuator 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
