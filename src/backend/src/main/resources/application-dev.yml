spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db_blue_net}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:000000}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_USERNAME:}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Object storage configuration
storage:
  enabled: true
  provider: ${STORAGE_PROVIDER:minio}
  bucket: ${STORAGE_BUCKET:bluenet}
  minio:
    endpoint: ${MINIO_ENDPOINT:localhost}
    port: ${MINIO_PORT:9000}
    accessKey: ${MINIO_AK:admin}
    secretKey: ${MINIO_SK:admin1234}
    useSSL: ${MINIO_USE_SSL:false}
  aliyun-oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_AK:}
    accessKeySecret: ${ALIYUN_OSS_SK:}

# Cookie 配置（开发环境）
cookie:
  domain: ${COOKIE_DOMAIN:}
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}
  max-age: ${COOKIE_MAX_AGE:43200}

# CORS 配置（开发环境）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
