[project]
name = "ai-service"
version = "0.1.0"
description = "蓝网团队ai智能检索客服"
requires-python = ">=3.12"
dependencies = [
    "pymilvus>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ipykernel>=7.2.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "langchain-experimental>=0.4.1",
    "langchain-community>=0.4.1",
    "langchain-ollama>=0.3.0",
    "python-docx>=1.2.0",
    "docx2txt>=0.9",
    "click>=8.0.0",
    "loguru>=0.7.0",
    "ruff>=0.15.10",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aio-pika>=9.5.0",
    "langgraph>=1.1.8",
]

[project.scripts]
load2db = "pipeline.load2db_pipeline:main"
agent = "agent.agent:test"
api = "uvicorn.main:main"

[project.optional-dependencies]
local-reranker = [
    "sentence-transformers>=3.0.0",
]
datasets = [
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "retrieval", "llm_providers", "agent", "tools", "chunking", "api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
