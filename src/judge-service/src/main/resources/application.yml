server:
  port: ${JUDGE_SERVER_PORT:8090}
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true

spring:
  application:
    name: bluenet-judge-service
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db_blue_net}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:000000}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:bluenet123}

storage:
  # 可选值：minio、aliyun-oss；判题服务复用主应用 OSS 连接信息。
  provider: ${STORAGE_PROVIDER:minio}
  minio:
    # MinIO 服务地址，不包含协议。
    endpoint: ${MINIO_ENDPOINT:localhost}
    # MinIO 服务端口。
    port: ${MINIO_PORT:9000}
    # MinIO access key。
    access-key: ${MINIO_AK:admin}
    # MinIO secret key。
    secret-key: ${MINIO_SK:admin1234}
    # 是否使用 HTTPS 访问 MinIO。
    use-ssl: ${MINIO_USE_SSL:false}
  aliyun-oss:
    # 阿里云 OSS endpoint；storage.provider=aliyun-oss 时使用。
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    # 阿里云 OSS access key id。
    access-key-id: ${ALIYUN_OSS_AK:}
    # 阿里云 OSS access key secret。
    access-key-secret: ${ALIYUN_OSS_SK:}

judge:
  rabbitmq:
    # 判题任务交换机名称。
    exchange: ${JUDGE_RABBITMQ_EXCHANGE:algorithm.judge}
    # 正式判题任务队列，消息体只包含 judge job id。
    formal-judge-queue: ${JUDGE_FORMAL_QUEUE:algorithm.judge.formal}
    # 测试数据生成任务队列，消息体只包含 judge config id。
    test-data-queue: ${JUDGE_TEST_DATA_QUEUE:algorithm.judge.test-data}
    # 正式判题 routing key。
    formal-judge-routing-key: ${JUDGE_FORMAL_ROUTING_KEY:judge.formal}
    # 测试数据生成 routing key。
    test-data-routing-key: ${JUDGE_TEST_DATA_ROUTING_KEY:judge.test-data}
    # 运行判题任务队列，消息体只包含 judge job id。
    run-judge-queue: ${JUDGE_RUN_QUEUE:algorithm.judge.run}
    # 运行判题 routing key。
    run-judge-routing-key: ${JUDGE_RUN_ROUTING_KEY:judge.run}
  storage:
    # 同一 OSS 服务下的判题专用 bucket，与主应用业务文件 bucket 隔离。
    bucket: ${JUDGE_STORAGE_BUCKET:bluenet-judge}
  sandbox:
    # 沙箱引擎，可选值：isolate、nsjail。
    engine: ${JUDGE_SANDBOX_ENGINE:isolate}
    # CPU 时间限制，单位秒。
    cpu-time-seconds: ${JUDGE_CPU_TIME_SECONDS:2}
    # 墙钟时间限制，单位秒。
    wall-time-seconds: ${JUDGE_WALL_TIME_SECONDS:5}
    # 内存限制，单位 MB。
    memory-limit-mb: ${JUDGE_MEMORY_LIMIT_MB:256}
    # 进程数量限制。
    process-limit: ${JUDGE_PROCESS_LIMIT:32}
    # 标准输出限制，单位 KB。
    output-limit-kb: ${JUDGE_OUTPUT_LIMIT_KB:1024}
    # generator 可生成文件总量限制，单位 MB。
    generated-file-limit-mb: ${JUDGE_GENERATED_FILE_LIMIT_MB:64}
    # 是否禁用网络访问。
    network-disabled: ${JUDGE_NETWORK_DISABLED:true}
    # worker 临时工作目录根路径。
    work-root: ${JUDGE_WORK_ROOT:/var/lib/bluenet-judge/work}

mybatis-plus:
  mapper-locations: classpath:infrastructure/repository/mapper/*.xml
  type-aliases-package: com.bluenet.judge.infrastructure.repository.dataobject
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
