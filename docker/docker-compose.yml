  COOKIE_MAX_AGE: ${COOKIE_MAX_AGE:-43200}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

x-frontend-env: &frontend-env
  BACKEND_HOST: backend
  BACKEND_PORT: 8080
  SSL_ENABLED: ${SSL_ENABLED:-false}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-localhost}
  NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-8080}
  NEXT_PUBLIC_SSL_ENABLED: ${NEXT_PUBLIC_SSL_ENABLED:-false}
  NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}

services:
  backend:
    image: ${BACKEND_IMAGE:-bluenet-backend:latest}
    build:
      context: ..
      dockerfile: backend.Dockerfile
    container_name: bluenet-backend
    ports:
      - "8080:8080"
      - "18088:8088"
    environment: *backend-env
    depends_on:
      oss:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  frontend:
    image: ${FRONTEND_IMAGE:-bluenet-frontend:latest}
    build:
      context: ..
      dockerfile: frontend.Dockerfile
    container_name: bluenet-frontend
    ports:
      - "3000:3000"
    environment: *frontend-env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bluenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bluenet123}
    volumes:
      - bluenet_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  oss:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bluenet-oss
    ports:
      - "7000:9000"
      - "7001:7001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin123}
    command: server /data --console-address ":7001"
    volumes:
      - bluenet_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

networks:
  bluenet-network:
    driver: bridge

volumes:
  bluenet_rabbitmq_data:
    name: bluenet-rabbitmq-${ENV:-dev}-data
  bluenet_minio_data:
    name: bluenet-minio-${ENV:-dev}-data
