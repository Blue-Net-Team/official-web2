x-backend-env: &backend-env
  DATABASE_HOST: database
  DATABASE_PORT: 5432
  DATABASE_NAME: db_blue_net
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: ${DB_PASSWORD:-hyfzhl999}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bluenet123}
  MAIL_USERNAME: ${MAIL_USERNAME:-gdou_bluenet@163.com}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-WUxwy9YxyMW3DzA6}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-bluenet}
  MINIO_ENDPOINT: oss
  MINIO_PORT: 9000
  MINIO_AK: admin
  MINIO_SK: ${MINIO_PASSWORD:-admin123}
  MINIO_USE_SSL: false
  ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
  ALIYUN_OSS_AK: ${ALIYUN_OSS_AK:-}
  ALIYUN_OSS_SK: ${ALIYUN_OSS_SK:-}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-zB88N23VOdV3bCXCWBrUHFrB6ifAxK5lFX6F}
  SYSTEM_USER_USERNAME: ${SYSTEM_USER_USERNAME:-system}
  SYSTEM_USER_PASSWORD: ${SYSTEM_USER_PASSWORD:-admin123}
  SYSTEM_USER_STUDENT_ID: ${SYSTEM_USER_STUDENT_ID:-000000000000}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  COOKIE_MAX_AGE: ${COOKIE_MAX_AGE:-43200}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

x-frontend-env: &frontend-env
  BACKEND_HOST: backend
  BACKEND_PORT: 8080
  SSL_ENABLED: ${SSL_ENABLED:-false}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-localhost}
  NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-8080}
  NEXT_PUBLIC_SSL_ENABLED: ${NEXT_PUBLIC_SSL_ENABLED:-false}
  NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}

services:
  backend:
    image: ${BACKEND_IMAGE:-bluenet-backend:latest}
    build:
      context: ..
      dockerfile: backend.Dockerfile
    container_name: bluenet-backend
    ports:
      - "8080:8080"
      - "18088:8088"
    environment: *backend-env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      oss:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  frontend:
    image: ${FRONTEND_IMAGE:-bluenet-frontend:latest}
    build:
      context: ..
      dockerfile: frontend.Dockerfile
    container_name: bluenet-frontend
    ports:
      - "3000:3000"
    environment: *frontend-env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  judge-service:
    image: ${JUDGE_IMAGE:-bluenet-judge-service:latest}
    build:
      context: ..
      dockerfile: docker/judge-service.Dockerfile
    container_name: bluenet-judge-service
    ports:
      - "8090:8090"
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: db_blue_net
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DB_PASSWORD:-hyfzhl999}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bluenet123}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: oss
      MINIO_PORT: 9000
      MINIO_AK: admin
      MINIO_SK: ${MINIO_PASSWORD:-admin123}
      MINIO_USE_SSL: false
      JUDGE_STORAGE_BUCKET: bluenet-judge
      JUDGE_SANDBOX_ENGINE: isolate
      JUDGE_WORK_ROOT: /var/lib/bluenet-judge/work
      LANG: C.UTF-8
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      oss:
        condition: service_healthy
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  database:
    image: postgres:17
    container_name: bluenet-pgsql
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: db_blue_net
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dg24Nihng@49*}
    volumes:
      - bluenet_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_blue_net"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bluenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bluenet123}
    volumes:
      - bluenet_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  redis:
    image: redis:7
    container_name: bluenet-redis
    ports:
      - "6739:6379"
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    volumes:
      - bluenet_redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  oss:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bluenet-oss
    ports:
      - "7000:9000"
      - "7001:7001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin123}
    command: server /data --console-address ":7001"
    volumes:
      - bluenet_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

networks:
  bluenet-network:
    driver: bridge

volumes:
  bluenet_database_data:
    name: bluenet-database-${ENV:-dev}-data
  bluenet_rabbitmq_data:
    name: bluenet-rabbitmq-${ENV:-dev}-data
  bluenet_redis_data:
    name: bluenet-redis-${ENV:-dev}-data
  bluenet_minio_data:
    name: bluenet-minio-${ENV:-dev}-data
