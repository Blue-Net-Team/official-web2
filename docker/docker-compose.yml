x-shared-env: &shared-env
  DATABASE_HOST: ${DATABASE_HOST:-database}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: db_blue_net
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: ${DB_PASSWORD:-000000}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bluenet123}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-oss}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_AK: ${MINIO_AK:-admin}
  MINIO_SK: ${MINIO_PASSWORD:-admin123}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  # 阿里云 OSS 配置；STORAGE_PROVIDER=aliyun-oss 时必填。
  ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
  ALIYUN_OSS_PUBLIC_ENDPOINT: ${ALIYUN_OSS_PUBLIC_ENDPOINT:-}
  ALIYUN_OSS_AK: ${ALIYUN_OSS_AK:-}
  ALIYUN_OSS_SK: ${ALIYUN_OSS_SK:-}

x-api-service-env: &api-service-env
  <<: *shared-env
  MAIL_USERNAME: ${MAIL_USERNAME:-gdou_bluenet@163.com}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-WUxwy9YxyMW3DzA6}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-bluenet}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://host.docker.internal:7000}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-zB88N23VOdV3bCXCWBrUHFrB6ifAxK5lFX6F}
  SYSTEM_USER_USERNAME: ${SYSTEM_USER_USERNAME:-system}
  SYSTEM_USER_PASSWORD: ${SYSTEM_USER_PASSWORD:-admin123}
  SYSTEM_USER_STUDENT_ID: ${SYSTEM_USER_STUDENT_ID:-000000000000}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  COOKIE_MAX_AGE: ${COOKIE_MAX_AGE:-43200}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

  # GitHub OAuth 配置
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_OAUTH_CALLBACK_BASE_URL: ${GITHUB_OAUTH_CALLBACK_BASE_URL:-http://localhost:8080}
  GITHUB_FRONTEND_BASE_URL: ${GITHUB_FRONTEND_BASE_URL:-http://localhost:3000}

  # GitHub App 配置（Bug 报告同步到 GitHub Issue）
  # 不配置或留空时，同步功能自动禁用
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  # 注意：容器内路径固定为 /app/github-private-key.pem，通过 volumes 挂载注入
  GITHUB_APP_PRIVATE_KEY_PATH: /app/github-private-key.pem
  GITHUB_APP_OWNER: ${GITHUB_APP_OWNER:-}
  GITHUB_APP_REPO: ${GITHUB_APP_REPO:-}
  GITHUB_APP_APP_BASE_URL: ${GITHUB_APP_APP_BASE_URL:-http://localhost:8080}

x-frontend-env: &frontend-env
  BACKEND_HOST: api-service
  BACKEND_PORT: 8080
  SSL_ENABLED: ${SSL_ENABLED:-false}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-localhost}
  NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-8080}
  NEXT_PUBLIC_SSL_ENABLED: ${NEXT_PUBLIC_SSL_ENABLED:-false}
  NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
  NEXT_PUBLIC_AI_SERVICE_HOST: ${NEXT_PUBLIC_AI_SERVICE_HOST:-localhost}
  NEXT_PUBLIC_AI_SERVICE_PORT: ${NEXT_PUBLIC_AI_SERVICE_PORT:-8000}
  NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED: ${NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED:-false}
  NEXT_PUBLIC_AI_SERVICE_PREFIX: ${NEXT_PUBLIC_AI_SERVICE_PREFIX:-/ai/v1}

services:
  api-service:
    image: ${API_SERVICE_IMAGE:-bluenet-api-service:latest}
    build:
      context: ..
      dockerfile: api-service.Dockerfile
    container_name: bluenet-api-service
    ports:
      - "8080:8080"
      - "18088:8088"
    environment:
      <<: *api-service-env
      TZ: Asia/Shanghai
    # 启用 Bug 报告同步到 GitHub Issue 时，确保宿主机 .env 中 GITHUB_APP_PRIVATE_KEY_PATH 指向私钥文件
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_PATH:-docker/null.pem}:/app/github-private-key.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  frontend:
    image: ${FRONTEND_IMAGE:-bluenet-frontend:latest}
    build:
      context: ..
      dockerfile: frontend.Dockerfile
      args:
        BUILD_BACKEND_HOST: ${BACKEND_HOST:-api-service}
        BUILD_BACKEND_PORT: ${BACKEND_PORT:-8080}
        BUILD_SSL_ENABLED: ${SSL_ENABLED:-false}
        NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-localhost}
        NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-8080}
        NEXT_PUBLIC_SSL_ENABLED: ${NEXT_PUBLIC_SSL_ENABLED:-false}
        NEXT_PUBLIC_AI_SERVICE_HOST: ${NEXT_PUBLIC_AI_SERVICE_HOST:-localhost}
        NEXT_PUBLIC_AI_SERVICE_PORT: ${NEXT_PUBLIC_AI_SERVICE_PORT:-8000}
        NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED: ${NEXT_PUBLIC_AI_SERVICE_SSL_ENABLED:-false}
        NEXT_PUBLIC_AI_SERVICE_PREFIX: ${NEXT_PUBLIC_AI_SERVICE_PREFIX:-/ai/v1}
    container_name: bluenet-frontend
    ports:
      - "3000:3000"
    environment: *frontend-env
    depends_on:
      api-service:
        condition: service_healthy
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  judge-service:
    image: ${JUDGE_IMAGE:-bluenet-judge-service:latest}
    build:
      context: ..
      dockerfile: docker/judge-service.Dockerfile
    container_name: bluenet-judge-service
    ports:
      - "8090:8090"
    environment:
      <<: *shared-env
      JUDGE_STORAGE_BUCKET: ${JUDGE_STORAGE_BUCKET:-bluenet-judge}
      JUDGE_SANDBOX_ENGINE: isolate
      JUDGE_WORK_ROOT: /var/lib/bluenet-judge/work
      LANG: C.UTF-8
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/judge/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full
      - judge
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  database:
    image: pgvector/pgvector:pg17
    container_name: bluenet-pgsql
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: db_blue_net
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dg24Nihng@49*}
    volumes:
      - bluenet_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_blue_net"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - full
      - infra
      - infra-local
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bluenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bluenet123}
    volumes:
      - bluenet_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - full
      - infra
      - infra-local
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  redis:
    image: redis:7
    container_name: bluenet-redis
    ports:
      - "6739:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    volumes:
      - bluenet_redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - full
      - infra
      - infra-local
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  ai-service:
    image: ${AI_SERVICE_IMAGE:-bluenet-ai-service:latest}
    build:
      context: ..
      dockerfile: docker/ai-service.Dockerfile
    container_name: bluenet-ai-service
    ports:
      - "8000:8000"
    environment:
      <<: *shared-env
      # API 密钥（从 .env 注入，不在 Dockerfile 中写死）
      TBD_RAG_SILICONFLOW_API_KEY: ${TBD_RAG_SILICONFLOW_API_KEY:-}
      TBD_RAG_DEEPSEEK_API_KEY: ${TBD_RAG_DEEPSEEK_API_KEY:-}
      # RabbitMQ
      TBD_RAG_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      TBD_RAG_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      TBD_RAG_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      TBD_RAG_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bluenet123}
      # Milvus
      TBD_RAG_MILVUS_URI: ${TBD_RAG_MILVUS_URI:-http://milvus:19530}
      TBD_RAG_MILVUS_TOKEN: ${TBD_RAG_MILVUS_TOKEN:-}
      # PgVector
      TBD_RAG_PGVECTOR_URI: ${TBD_RAG_PGVECTOR_URI:-postgresql://postgres:postgres@database:5432/rag}
      TBD_RAG_PGVECTOR_POOL_SIZE: ${TBD_RAG_PGVECTOR_POOL_SIZE:-10}
      # Collection & Vector
      TBD_RAG_TAGS_COLLECTION_NAME: ${TBD_RAG_TAGS_COLLECTION_NAME:-tags_collection}
      TBD_RAG_CHUNKS_COLLECTION_NAME: ${TBD_RAG_CHUNKS_COLLECTION_NAME:-chunks_collection}
      TBD_RAG_DOCS_COLLECTION_NAME: ${TBD_RAG_DOCS_COLLECTION_NAME:-docs_collection}
      TBD_RAG_VECTOR_DIMENSION: ${TBD_RAG_VECTOR_DIMENSION:-1024}
      TBD_RAG_VECTOR_INDEX_TYPE: ${TBD_RAG_VECTOR_INDEX_TYPE:-HNSW}
      TBD_RAG_VECTOR_METRIC_TYPE: ${TBD_RAG_VECTOR_METRIC_TYPE:-COSINE}
      TBD_RAG_VECTOR_STORE_BACKEND: ${TBD_RAG_VECTOR_STORE_BACKEND:-milvus}
      # Chunking
      TBD_RAG_CHUNK_MAX_TOKENS: ${TBD_RAG_CHUNK_MAX_TOKENS:-4000}
      # Embedding / LLM / Reranker
      TBD_RAG_EMBEDDING_PROVIDER: ${TBD_RAG_EMBEDDING_PROVIDER:-siliconflow}
      TBD_RAG_LLM_PROVIDER: ${TBD_RAG_LLM_PROVIDER:-siliconflow}
      TBD_RAG_LLM_TEMPERATURE: ${TBD_RAG_LLM_TEMPERATURE:-0.7}
      TBD_RAG_LLM_TIMEOUT: ${TBD_RAG_LLM_TIMEOUT:-60}
      TBD_RAG_RERANKER_PROVIDER: ${TBD_RAG_RERANKER_PROVIDER:-siliconflow}
      # Ollama（本地开发可选）
      TBD_RAG_OLLAMA_BASE_URL: ${TBD_RAG_OLLAMA_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ai/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

  oss:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bluenet-oss
    ports:
      - "7000:9000"
      - "7001:7001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-admin123}
    command: server /data --console-address ":7001"
    volumes:
      - bluenet_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - full
      - infra-local
    restart: ${RESTART_POLICY:-no}
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  bluenet_database_data:
    name: bluenet-database-${ENV:-dev}-data
  bluenet_rabbitmq_data:
    name: bluenet-rabbitmq-${ENV:-dev}-data
  bluenet_redis_data:
    name: bluenet-redis-${ENV:-dev}-data
  bluenet_minio_data:
    name: bluenet-minio-${ENV:-dev}-data
