x-backend-env: &backend-env
  DATABASE_HOST: database
  DATABASE_PORT: 5432
  DATABASE_NAME: db_blue_net
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: ${DB_PASSWORD:-hyfzhl999}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: admin
  RABBITMQ_PASSWORD: bluenet123
  MAIL_USERNAME: ${MAIL_USERNAME:-gdou_bluenet@163.com}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-WUxwy9YxyMW3DzA6}
  MINIO_ENDPOINT: oss
  MINIO_PORT: 9000
  MINIO_AK: admin
  MINIO_SK: ${MINIO_PASSWORD:-admin123}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:-zB88N23VOdV3bCXCWBrUHFrB6ifAxK5lFX6F}
  SYSTEM_USER_USERNAME: ${SYSTEM_USER_USERNAME:-system}
  SYSTEM_USER_PASSWORD: ${SYSTEM_USER_PASSWORD:-admin123}
  SYSTEM_USER_STUDENT_ID: ${SYSTEM_USER_STUDENT_ID:-000000000000}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  COOKIE_MAX_AGE: ${COOKIE_MAX_AGE:-43200}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

x-frontend-env: &frontend-env
  BACKEND_HOST: backend
  BACKEND_PORT: 8080
  SSL_ENABLED: ${SSL_ENABLED:-false}
  API_PREFIX: ${API_PREFIX:-/api/v1}

services:
  backend:
    image: ${BACKEND_IMAGE:-bluenet-backend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: bluenet-backend
    ports:
      - "8080:8080"
      - "18088:8088"
    environment: *backend-env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      oss:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  frontend:
    image: ${FRONTEND_IMAGE:-bluenet-frontend:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: bluenet-frontend
    ports:
      - "3000:3000"
    environment: *frontend-env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full
      - app
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  database:
    image: postgres:17
    container_name: bluenet-pgsql
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: db_blue_net
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dg24Nihng@49*}
    volumes:
      - bluenet_database_${ENV:-dev}_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blue_net"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bluenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: bluenet123
    volumes:
      - bluenet_rabbitmq_${ENV:-dev}_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  redis:
    image: redis:7-alpine
    container_name: bluenet-redis
    ports:
      - "6739:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - bluenet_redis_${ENV:-dev}_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

  oss:
    image: minio/minio:latest
    container_name: bluenet-oss
    ports:
      - "7000:9000"
      - "7001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-g05q80*EH04}
    command: server /data --console-address ":9001"
    volumes:
      - bluenet_minio_${ENV:-dev}_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - full
      - infra
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-network

networks:
  bluenet-network:
    driver: bridge
