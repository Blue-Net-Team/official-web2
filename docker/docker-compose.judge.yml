# 判题服务独立部署配置
# 用于将 judge-service 部署到独立服务器
# 所有外部服务（数据库、RabbitMQ、MinIO）均通过环境变量配置

services:
  judge-service:
    image: ${JUDGE_IMAGE:-bluenet-judge-service:latest}
    build:
      context: ..
      dockerfile: docker/judge-service.Dockerfile
    container_name: bluenet-judge-service
    ports:
      - "8090:8090"
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-localhost}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-db_blue_net}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-hyfzhl999}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bluenet123}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-localhost}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_AK: ${MINIO_AK:-admin}
      MINIO_SK: ${MINIO_PASSWORD:-admin123}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      JUDGE_STORAGE_BUCKET: ${JUDGE_STORAGE_BUCKET:-bluenet-judge}
      JUDGE_SANDBOX_ENGINE: ${JUDGE_SANDBOX_ENGINE:-isolate}
      JUDGE_WORK_ROOT: ${JUDGE_WORK_ROOT:-/var/lib/bluenet-judge/work}
      LANG: C.UTF-8
    restart: ${RESTART_POLICY:-no}
    networks:
      - bluenet-judge-network

networks:
  bluenet-judge-network:
    driver: bridge
